title: 夜ふかし郵便局(仮)
description: 思考とか日記とかについて考える
theme: minima
markdown: CommonMarkGhPages
commonmark:
  options:
    - UNSAFE
    - FOOTNOTES
  extensions:
    - strikethrough
    - autolink
    - table
    - tagfilter
defaults:
  - scope:
      path: "Diary"
      type: "pages"
    values:
      rss: true
      layout: diary_entry
