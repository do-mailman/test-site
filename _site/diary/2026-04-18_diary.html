  <div class="post-content e-content" itemprop="articleBody">
    <p>『暇と退屈の倫理学』と『CHANGE』を読み進める。あともう少しで両方とも読み終わりそうだ。</p>
<p>出かけた時に長時間おなかに何もいれないと、頭がぼんやりするということが何となくわかってきたので、出かけるときのうまい栄養補給方法を考えたい。できれば歯に悪影響がないものが良い。</p>
<p>いい天気だったので、散歩をした。</p>
